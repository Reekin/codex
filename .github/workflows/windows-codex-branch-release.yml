name: windows-codex-branch-release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: windows-codex-branch-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.repository == 'Reekin/codex'
    name: Build Windows codex.exe and publish latest release
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ env.TARGET }}

      - name: Define release metadata
        id: meta
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          branch_slug="$(
            printf '%s' "$branch" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
              | cut -c1-80 \
              | sed -E 's/-+$//'
          )"
          if [[ -z "$branch_slug" ]]; then
            branch_slug="branch"
          fi

          short_sha="${GITHUB_SHA::12}"
          release_tag="codex-latest-${branch_slug}-${short_sha}"
          asset_prefix="codex-windows-x64-portable"

          {
            echo "branch=${branch}"
            echo "branch_slug=${branch_slug}"
            echo "short_sha=${short_sha}"
            echo "release_tag=${release_tag}"
            echo "asset_prefix=${asset_prefix}"
          } >> "$GITHUB_OUTPUT"

      - name: Cargo build codex.exe
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_PROFILE_RELEASE_LTO=${CARGO_PROFILE_RELEASE_LTO}"
          cargo build --target "${TARGET}" --release --bin codex --timings

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE}"
          if command -v cygpath >/dev/null 2>&1; then
            workspace="$(cygpath -u "$workspace")"
          fi
          dist="${workspace}/dist"
          asset_prefix="${{ steps.meta.outputs.asset_prefix }}"
          mkdir -p "$dist"

          cp "target/${TARGET}/release/codex.exe" "$dist/${asset_prefix}.exe"

          dist_windows="$dist"
          if command -v cygpath >/dev/null 2>&1; then
            dist_windows="$(cygpath -w "$dist")"
          fi
          powershell -NoProfile -Command \
            "Compress-Archive -LiteralPath '${dist_windows}\\${asset_prefix}.exe' -DestinationPath '${dist_windows}\\${asset_prefix}.zip' -Force"

          (cd "$dist" && sha256sum "${asset_prefix}.exe" "${asset_prefix}.zip" > "${asset_prefix}.sha256")
          ls -lh "$dist"

      - name: Publish GitHub latest release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="${{ steps.meta.outputs.release_tag }}"
          release_name="Codex Windows portable build: ${{ steps.meta.outputs.branch }} @ ${{ steps.meta.outputs.short_sha }}"
          notes_path="${RUNNER_TEMP}/codex-dev-release-notes.md"

          cat > "$notes_path" <<EOF
          Automated Windows dev build for branch \`${{ steps.meta.outputs.branch }}\`.

          - Commit: \`${GITHUB_SHA}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Target: \`${TARGET}\`
          - Binary: unsigned portable branch build
          - LTO: \`${CARGO_PROFILE_RELEASE_LTO}\`

          This release is generated automatically from the downstream branch push and is marked as the repository latest release. Download \`codex-windows-x64-portable.exe\` for the standalone executable, or \`codex-windows-x64-portable.zip\` for the compressed portable package.
          EOF

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$release_name" \
              --notes-file "$notes_path" \
              --latest
          else
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_name" \
              --notes-file "$notes_path" \
              --latest
          fi

          gh release upload "$release_tag" dist/* --clobber
