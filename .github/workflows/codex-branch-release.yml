name: codex-branch-release

on:
  push:
    branches:
      - "integration-*"
  workflow_dispatch:

concurrency:
  group: codex-branch-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-compile:
    if: github.repository == 'Reekin/codex' && startsWith(github.ref_name, 'integration-')
    # Release builds skip test code, so a test that no longer compiles would otherwise ship unseen.
    name: Compile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install native dependencies
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Compile every workspace test target
        # The voice host needs GStreamer 1.28, newer than this runner ships.
        run: cargo check --profile dev-small --workspace --exclude codex-voice-host --tests

  windows:
    if: github.repository == 'Reekin/codex' && startsWith(github.ref_name, 'integration-')
    uses: ./.github/workflows/codex-branch-package.yml
    with:
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      package: codex-windows-x64.zip

  macos:
    if: github.repository == 'Reekin/codex' && startsWith(github.ref_name, 'integration-')
    uses: ./.github/workflows/codex-branch-package.yml
    with:
      runner: macos-15
      target: aarch64-apple-darwin
      package: codex-macos-arm64.tar.gz

  # Publishing waits only for Windows; the slower macOS package is attached to the same release.
  publish:
    needs: [windows, test-compile]
    name: Publish latest release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release-tag: ${{ steps.publish.outputs.release-tag }}
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-package-x86_64-pc-windows-msvc
          path: dist

      - name: Publish GitHub latest release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#integration-}"
          short_sha="${GITHUB_SHA::12}"
          # GitHub lists releases by tag date, then by tag name. An annotated tag dated now, named
          # with the publish time, keeps the list in publish order.
          published="$(date -u +%Y%m%dT%H%M%SZ)"
          release_tag="codex-${version}-${published}-${short_sha}"
          # The integration acceptance tag on this commit, pushed together with it, names the build.
          revision="$(git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            "refs/tags/personal/integration/${version}*" \
            | awk -v sha="$GITHUB_SHA" '$1 == sha { sub(/^refs\/tags\/personal\/integration\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' \
            | sort -V | tail -n 1)"
          title="Codex ${revision:-$version} (${short_sha})"
          notes_path="${RUNNER_TEMP}/codex-release-notes.md"

          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

          {
            echo "Automated dev build of branch \`${GITHUB_REF_NAME}\`."
            echo
            if [[ -n "$revision" ]]; then
              echo "- Integration revision: \`personal/integration/${revision}\`"
            fi
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$notes_path"
          cat >> "$notes_path" <<'EOF'

          Packages:

          - `codex-windows-x64.zip`: Windows x64. Extract it and run `bin\codex.exe`.
          - `codex-macos-arm64.tar.gz`: macOS on Apple Silicon, attached when its build finishes, usually two to three hours after the Windows package. The archive has no top-level folder, so extract it into a new directory: `mkdir codex && tar -xzf codex-macos-arm64.tar.gz -C codex`, then run `codex/bin/codex`.

          Keep each extracted package directory intact: `codex` loads the code-mode host and bundled tools from it.

          The macOS binaries are ad-hoc signed and not notarized. Archives fetched with `gh release download` or `curl` run as is. After a browser download, run `xattr -dr com.apple.quarantine <extracted-dir>` once before the first launch.
          EOF

          tag_object="$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$release_tag" -f message="$title" -f object="$GITHUB_SHA" -f type=commit \
            --jq .sha)"
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${release_tag}" -f sha="$tag_object" >/dev/null
          gh release create "$release_tag" \
            --verify-tag \
            --title "$title" \
            --notes-file "$notes_path" \
            --latest \
            dist/*
          echo "release-tag=${release_tag}" >> "$GITHUB_OUTPUT"

  attach-macos:
    needs: [publish, macos]
    name: Attach macOS package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-package-aarch64-apple-darwin
          path: dist

      - name: Attach to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.release-tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir dist
          (cd dist && sha256sum -- codex-macos-arm64.tar.gz >> SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" dist/codex-macos-arm64.tar.gz
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS.txt --clobber
